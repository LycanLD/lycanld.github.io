<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: rgba(17, 24, 39, 0.9);
        --text: #e5eefb;
        --muted: #9fb3d1;
        --accent: #67e8f9;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #14213d 0%, #0b1020 50%, #050b16 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        width: min(1000px, 90vw);
        background: var(--card);
        border: 1px solid rgba(103, 232, 249, 0.28);
        border-radius: 22px;
        padding: 32px 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 26px;
        text-align: center;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.12em;
        color: var(--accent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
      }

      .zone {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(159, 179, 209, 0.25);
        border-radius: 16px;
        padding: 18px 16px;
      }

      .label {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .time {
        font-size: clamp(1.7rem, 3vw, 2.5rem);
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .date {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>WORLD CLOCK</h1>
      <div class="grid">
        <div class="zone">
          <div class="label">New York</div>
          <div class="time" id="ny-time">--:--:--</div>
          <div class="date" id="ny-date">--</div>
        </div>

        <div class="zone">
          <div class="label">London</div>
          <div class="time" id="london-time">--:--:--</div>
          <div class="date" id="london-date">--</div>
        </div>

        <div class="zone">
          <div class="label">Tokyo</div>
          <div class="time" id="tokyo-time">--:--:--</div>
          <div class="date" id="tokyo-date">--</div>
        </div>

        <div class="zone">
          <div class="label">Sydney</div>
          <div class="time" id="sydney-time">--:--:--</div>
          <div class="date" id="sydney-date">--</div>
        </div>
      </div>
    </div>

    <script>
      function formatTime(date, timeZone) {
        return new Intl.DateTimeFormat('en-GB', {
          timeZone,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false,
        }).format(date);
      }

      function formatDate(date, timeZone) {
        return new Intl.DateTimeFormat('en-US', {
          timeZone,
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          year: 'numeric',
        }).format(date);
      }

      function updateClocks() {
        const now = new Date();
        const zones = [
          ['ny-time', 'ny-date', 'America/New_York'],
          ['london-time', 'london-date', 'Europe/London'],
          ['tokyo-time', 'tokyo-date', 'Asia/Tokyo'],
          ['sydney-time', 'sydney-date', 'Australia/Sydney']
        ];

        zones.forEach(([timeId, dateId, timeZone]) => {
          const timeEl = document.getElementById(timeId);
          const dateEl = document.getElementById(dateId);
          timeEl.textContent = formatTime(now, timeZone);
          dateEl.textContent = formatDate(now, timeZone);
        });
      }

      updateClocks();
      setInterval(updateClocks, 1000);
    </script>
  </body>
</html>
